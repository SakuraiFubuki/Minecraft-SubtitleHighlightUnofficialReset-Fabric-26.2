plugins {
    // 26.x 线用原生 loom（无 remap 后缀），依赖一律走 implementation（非 1.x 时代的 mod 依赖配置）。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    mavenCentral()
}

dependencies {    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1 起 Minecraft 不再混淆，Mojang 官方类名直接可用，因此没有映射声明
    // （26.x 无 yarn，loom 26.1+ 对未混淆版本默认即官方名；官方 26.2 / 26.3 分支示例都不写映射行）。
    // 依赖配置用 implementation（1.x 时代是 mod 依赖配置，26.x 用普通 implementation）。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 配置界面依赖（均为可选/软依赖：缺失时命令与按键仍然可用）
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// 与仓库里其它版本目录保持一致：客户端代码与资源直接并入 main，不开 splitEnvironmentSourceSets。
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/client/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/client/resources']
        }
    }
}

// 目标 Java 版本用 toolchain 声明（不是 options.release + source/targetCompatibility）：
// 环境 JDK 低于目标时（例如本机默认 Java 22、26.x 线目标 25），只有 toolchain 才会
// 让 foojay 自动 provision 对应 JDK；否则 javac 会直接报「不支持发行版本 25」。
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE.md") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
